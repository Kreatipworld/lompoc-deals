<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; }
  .card {
    width:1200px; height:630px; position:relative; overflow:hidden;
    background: radial-gradient(1200px 760px at 80% -12%, #8a1a9c 0%, #650C75 44%, #46074f 100%);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; color:#fff;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:70px 84px 80px;
  }
  .brand { display:flex; align-items:center; gap:18px; }
  .brand svg { height:58px; width:auto; display:block; }
  .brand .wm { font-size:30px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; }
  .eyebrow { font-size:24px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:#EFC618; margin-bottom:14px; }
  .title { font-size:110px; font-weight:800; line-height:1.0; letter-spacing:-.025em; }
  .tag { font-size:33px; line-height:1.38; color:rgba(255,255,255,.92); max-width:960px; margin-top:24px; font-weight:500; }
  .foot { display:flex; align-items:center; justify-content:space-between; }
  .foot .url { font-size:28px; font-weight:700; color:#EFC618; }
  .foot .pill { font-size:25px; font-weight:700; background:rgba(255,255,255,.16); padding:14px 26px; border-radius:999px; }
  .accent { position:absolute; left:0; bottom:0; height:12px; width:100%; background:linear-gradient(90deg,#EFC618 0%,#0B992F 55%,#650C75 100%); }
</style></head>
<body><div class="card">
  <div class="brand">
    <svg viewBox="60 136 314 402" xmlns="http://www.w3.org/2000/svg" aria-label="Lompoc Locals mark">
      <path fill="#ffffff" fill-rule="evenodd" d="M257,161.4c-10-17.2-32.1-23.1-49.4-13.1-17.2,10-23.1,32.1-13.1,49.4,10,17.2,32.1,23.1,49.4,13.1,17.2-10,23.1-32.1,13.1-49.4"/>
      <path fill="#ffffff" opacity="0.85" d="M217.6,334.1c40.9-41.5,89.3-69.6,151.4-52.3-49.4-64.1-103.3-64.5-154.4-36.9,5.2,27.4,5.5,58.1,3.1,89.2"/>
      <path fill="#ffffff" d="M250.9,465.7h0s-72.8,0-72.8,0c21.8-102.6,83.4-304.7-107.3-296.1,108.1,59.5,27.8,259.1,6.6,359.2h244v-63.1h-70.5Z"/>
    </svg>
    <div class="wm">Lompoc Locals</div>
  </div>
  <div>
    <div class="eyebrow">For Businesses</div>
    <div class="title">Partner Guide</div>
    <div class="tag">The #1 local hub for Lompoc &amp; Vandenberg — get discovered by neighbors across deals, businesses, events, and things to do.</div>
  </div>
  <div class="foot">
    <div class="url">lompoclocals.com</div>
    <div class="pill">Become a partner →</div>
  </div>
  <div class="accent"></div>
</div></body></html>
