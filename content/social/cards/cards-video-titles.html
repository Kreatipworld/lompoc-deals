<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
  /* Transparent title plates composited over the generated intro footage.
     Rendered with --default-background-color=00000000 so the alpha survives. */
  :root { --gold:#EFC618; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:transparent; font-family:'Plus Jakarta Sans',sans-serif; }
  .card { position:relative; width:1080px; height:1920px; overflow:hidden; background:transparent; }
  .scrim { position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(20,8,24,.55) 0%, rgba(20,8,24,0) 34%, rgba(20,8,24,0) 52%, rgba(20,8,24,.86) 100%); }
  .wrap { position:absolute; left:0; right:0; bottom:300px; text-align:center; padding:0 90px; }
  .serif { font-family:Georgia,serif; font-style:italic; }
  .mark { position:absolute; top:150px; left:50%; transform:translateX(-50%); width:190px; }
</style></head><body>

<div class="card" id="title-locals">
  <div class="scrim"></div>
  <img class="mark" src="file:///Users/kreatip/Projects/lompoc-deals/public/brand/lompoc-locals-mark-white.svg">
  <div class="wrap">
    <div class="serif" style="color:var(--gold); font-size:60px;">all of it, in one place —</div>
    <div style="color:#fff; font-size:132px; font-weight:800; line-height:1.02; margin-top:22px; text-shadow:0 6px 30px rgba(0,0,0,.5);">LOMPOC<br>LOCALS</div>
  </div>
</div>

<div class="card" id="title-business">
  <div class="scrim"></div>
  <img class="mark" src="file:///Users/kreatip/Projects/lompoc-deals/public/brand/lompoc-locals-mark-white.svg">
  <div class="wrap">
    <div class="serif" style="color:var(--gold); font-size:58px;">every shop on this street —</div>
    <div style="color:#fff; font-size:110px; font-weight:800; line-height:1.03; margin-top:22px; text-shadow:0 6px 30px rgba(0,0,0,.5);">already has<br>a page.</div>
  </div>
</div>

</body></html>
