<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      @font-face { font-family:"Plus Jakarta Sans"; src:url("public/fonts/plus-jakarta-sans-latin.woff2") format("woff2"); font-weight:200 800; font-style:normal; }
      html, body { margin:0; width:1080px; height:1920px; overflow:hidden; background:#0d0b10; }
      body { font-family:"Plus Jakarta Sans", sans-serif; }
      #root { position:relative; width:1080px; height:1920px; overflow:hidden; }
      #root > div[data-composition-src] { position:absolute; inset:0; }
    </style>
  </head>
  <body>
    <!-- THE LOMPOC LUNCH BOARD — Fri Sep 18 2026. Split-flap board of every local kitchen open
         through the midday hour; members first with their own photos and real Friday hours.
         20.50s. Own assets only. Generated by gen.py. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="20.50" data-width="1080" data-height="1920">
      <div id="el-s1-wake" data-composition-id="s1-wake" data-composition-src="compositions/s1-wake.html" data-start="0.00" data-duration="3.05" data-track-index="1"></div>
      <div id="el-s2-members" data-composition-id="s2-members" data-composition-src="compositions/s2-members.html" data-start="2.85" data-duration="7.85" data-track-index="2"></div>
      <div id="el-s3-more" data-composition-id="s3-more" data-composition-src="compositions/s3-more.html" data-start="10.50" data-duration="5.20" data-track-index="3"></div>
      <div id="el-s4-end" data-composition-id="s4-end" data-composition-src="compositions/s4-end.html" data-start="15.50" data-duration="5.00" data-track-index="4"></div>
      <div id="el-subs" data-composition-id="subs" data-composition-src="compositions/subs.html" data-start="0" data-duration="20.50" data-track-index="5"></div>
      <div id="el-progress" data-composition-id="progress" data-composition-src="compositions/progress.html" data-start="0" data-duration="20.50" data-track-index="6"></div>

    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
