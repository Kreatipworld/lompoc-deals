<template>

    </style>
    <div style="position: absolute; inset: 0; background: radial-gradient(ellipse 130% 90% at 50% 30%, rgba(36,22,41,0) 30%, rgba(36,22,41,0.55) 100%)"></div>

    <div id="a2-pa" style="position: absolute; left: 84px; right: 84px; top: 26%">
      <div id="a2-num" style="color: #efc618; font-weight: 800; font-size: 300px; line-height: 0.9; letter-spacing: -14px; font-variant-numeric: tabular-nums">0<span style="font-size: 200px; letter-spacing: -6px">+</span></div>

      <div id="a2-sub" style="margin-top: 30px; font-family: Georgia, serif; font-style: italic; color: rgba(250,245,236,0.85); font-size: 46px">listed on Lompoc Locals</div>
    </div>

    <!-- phase B: three real pages fan in behind the lines -->
    <div id="a2-cards" style="position: absolute; left: 0; right: 0; top: 52%; height: 900px; opacity: 0">
      <div id="a2-k1" class="a2-card" style="left: 60px; top: 60px; transform: rotate(-6deg)"><img src="public/ui/news.png" alt="" style="top: -1560px" /></div>
      <div id="a2-k2" class="a2-card" style="left: 340px; top: 20px; transform: rotate(2deg)"><img src="public/ui/events.png" alt="" style="top: -2060px" /></div>

    <div style="position: absolute; top: 5.2%; left: 84px; z-index: 40"><span style="display: inline-block; background: #efc618; color: #241629; font-weight: 800; font-size: 32px; letter-spacing: 3px; padding: 14px 26px; border-radius: 10px">LOMPOC LOCALS</span></div>

    <script>
      (() => {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true, defaults: { ease: "power4.out", duration: 0.5 } });
        const B = 2.87; // "The news." starts here (VO-mapped, Lompoke read)
        tl.addLabel("number", 0).addLabel("everything", B);
        const numEl = document.getElementById("a2-num");
        const counter = { n: 0 };
        tl.fromTo("#a2-bloom", { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.7, ease: "power2.out" }, "number");
        // count-up: seek-safe because onUpdate derives the text from the tweened value every frame
        tl.to(counter, { n: 450, duration: 1.6, ease: "power3.out", onUpdate: () => { numEl.firstChild.nodeValue = String(Math.round(counter.n)); } }, "number+=0.1");
        tl.fromTo("#a2-num", { autoAlpha: 0, scale: 0.9 }, { autoAlpha: 1, scale: 1, duration: 0.5 }, "number+=0.05");
        tl.fromTo("#a2-la", { clipPath: "inset(0 0 100% 0)", y: 30 }, { clipPath: "inset(0 0 0% 0)", y: 0, duration: 0.6 }, "number+=0.9");
        tl.fromTo("#a2-sub", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0 }, "number+=1.4");
        // to phase B
        tl.to("#a2-pa", { autoAlpha: 0, y: -30, duration: 0.3, ease: "power2.in" }, "everything-=0.3");
        tl.set("#a2-pa", { autoAlpha: 0 }, "everything");
        tl.set("#a2-pb", { autoAlpha: 1 }, "everything");
        tl.set("#a2-cards", { autoAlpha: 1 }, "everything");
        ["#a2-k1", "#a2-k2", "#a2-k3"].forEach((sel, i) => {
          tl.fromTo(sel, { autoAlpha: 0, y: 260, rotation: [-6, 2, 7][i] - 6 }, { autoAlpha: 1, y: 0, rotation: [-6, 2, 7][i], duration: 0.7 }, "everything+=" + [0.02, 0.98, 1.99][i]);
        });
        ["#a2-l1", "#a2-l2", "#a2-l3"].forEach((sel, i) => {
          tl.fromTo(sel, { clipPath: "inset(0 0 100% 0)", y: 30 }, { clipPath: "inset(0 0 0% 0)", y: 0, duration: 0.5 }, "everything+=" + [0.02, 0.98, 1.99][i]);
        });
        tl.fromTo("#a2-one", { autoAlpha: 0, scale: 0.85, y: 20 }, { autoAlpha: 1, scale: 1, y: 0, duration: 0.55, ease: "back.out(1.4)" }, "everything+=3.02");
        tl.fromTo("#a2-es", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0 }, "everything+=4.56");
        window.__timelines["a2-number"] = tl;
      })();
