<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      @font-face { font-family: "Plus Jakarta Sans"; src: url("public/fonts/plus-jakarta-sans-latin.woff2") format("woff2"); font-weight: 200 800; font-style: normal; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #140a17; }
      body { font-family: "Plus Jakarta Sans", sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #root > div[data-composition-src] { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <!-- TERRONES PLUMBING v2 — "Three calls". 24.0s. Kling scenario clips (illustration), Dylan read as the business, warm bed. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="24.00" data-width="1080" data-height="1920">
      <div id="el-s1" data-composition-id="s1-heater" data-composition-src="compositions/s1-heater.html" data-start="0"     data-duration="5.00" data-track-index="1"></div>
      <div id="el-s2" data-composition-id="s2-drain"  data-composition-src="compositions/s2-drain.html"  data-start="5.00"  data-duration="5.00" data-track-index="1"></div>
      <div id="el-s3" data-composition-id="s3-leak"   data-composition-src="compositions/s3-leak.html"   data-start="10.00" data-duration="4.60" data-track-index="1"></div>
      <div id="el-s4" data-composition-id="s4-fix"    data-composition-src="compositions/s4-fix.html"    data-start="14.60" data-duration="5.60" data-track-index="1"></div>
      <div id="el-s5" data-composition-id="s5-end"    data-composition-src="compositions/s5-end.html"    data-start="20.20" data-duration="3.80" data-track-index="1"></div>

      <!-- VOICE (Dylan, as the business) — five clips from the 14.11s read, placed to the scenes -->
      <audio id="vo-a" class="clip" data-audio-group="voiceover" src="public/vo-dylan.wav" data-start="1.00"  data-media-start="0.00"  data-duration="2.10" data-track-index="10" data-volume="1" data-fade-in="0.05" data-fade-out="0.05"></audio>
      <audio id="vo-b" class="clip" data-audio-group="voiceover" src="public/vo-dylan.wav" data-start="5.50"  data-media-start="2.32"  data-duration="1.20" data-track-index="10" data-volume="1" data-fade-in="0.05" data-fade-out="0.05"></audio>
      <audio id="vo-c" class="clip" data-audio-group="voiceover" src="public/vo-dylan.wav" data-start="10.00" data-media-start="3.66"  data-duration="1.70" data-track-index="10" data-volume="1" data-fade-in="0.05" data-fade-out="0.05"></audio>
      <audio id="vo-d" class="clip" data-audio-group="voiceover" src="public/vo-dylan.wav" data-start="14.80" data-media-start="5.60"  data-duration="5.30" data-track-index="10" data-volume="1" data-fade-in="0.05" data-fade-out="0.05"></audio>
      <audio id="vo-e" class="clip" data-audio-group="voiceover" src="public/vo-dylan.wav" data-start="20.40" data-media-start="11.22" data-duration="2.70" data-track-index="10" data-volume="1" data-fade-in="0.05" data-fade-out="0.05"></audio>

      <!-- BED: generated 24s warm bed, resolves on its own final chord -->
      <audio id="music-bed" class="clip" data-audio-group="music" src="public/bed.wav" data-start="0" data-media-start="0" data-duration="24.00" data-track-index="11" data-volume="0.32" data-fx-carve='{"enabled":true,"sources":["voiceover"],"strength":0.5}'></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
