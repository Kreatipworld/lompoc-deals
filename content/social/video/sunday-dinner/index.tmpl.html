<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>* { margin:0; padding:0; box-sizing:border-box; }
@font-face { font-family:"PJ"; src:url("public/fonts/plus-jakarta-sans-latin.woff2") format("woff2"); font-weight:200 800; }
html, body { width:1080px; height:1920px; overflow:hidden; background:#140A17; font-family:"PJ", sans-serif; }
#root { position:relative; width:1080px; height:1920px; overflow:hidden; background:#140A17; }
.shot { position:absolute; inset:0; overflow:hidden; visibility:hidden; }
.shot img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform-origin:50% 45%;
  filter:saturate(1.12) contrast(1.06) brightness(0.95) sepia(0.08); }
.shot .blur { filter:blur(40px) brightness(0.55) saturate(1.2); transform:scale(1.2); }
.shot .fit { object-fit:contain; }
.warm { position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse 90% 60% at 50% 40%, rgba(255,170,60,0.0) 40%, rgba(40,8,30,0.55) 100%),
             linear-gradient(180deg, rgba(20,10,23,0.6) 0%, rgba(20,10,23,0) 18%, rgba(20,10,23,0) 50%, rgba(20,10,23,0.8) 76%, rgba(20,10,23,0.94) 100%); }
#askbg { position:absolute; inset:0; background:radial-gradient(ellipse 90% 60% at 50% 42%, #8a1aa0 0%, #650C75 40%, #1c0521 100%); }
#askbg::after { content:""; position:absolute; inset:0; background:radial-gradient(circle at 50% 42%, rgba(239,198,24,0.25), rgba(239,198,24,0) 45%); }
.ui > * { position:absolute; }
/* plate wipe: a gold ring that opens to reveal the next restaurant */
.wipe { left:540px; top:900px; width:0; height:0; }
.wipe i { position:absolute; left:-1300px; top:-1300px; width:2600px; height:2600px; border-radius:50%;
  border:60px solid #EFC618; box-shadow:0 0 0 30px #650C75; visibility:hidden; }
/* cover / intro */
#intro { inset:0; }
#intro .k { position:absolute; left:0; right:0; top:330px; text-align:center; color:#EFC618; font-weight:800; font-size:46px; letter-spacing:12px; text-shadow:0 4px 20px rgba(0,0,0,0.9); }
#intro .tt { position:absolute; left:0; right:0; top:410px; text-align:center; color:#fff; font-weight:800; font-size:210px; line-height:0.9; letter-spacing:-8px;
  text-shadow:0 10px 0 #650C75, 0 26px 70px rgba(0,0,0,0.75); }
#intro .tt b { color:#EFC618; }
#intro .plates { position:absolute; left:0; right:0; top:930px; height:420px; }
#intro .pl { position:absolute; top:0; width:360px; height:360px; border-radius:50%; overflow:hidden; border:12px solid #fff;
  box-shadow:0 0 0 8px #EFC618, 0 30px 70px rgba(0,0,0,0.7); }
#intro .pl img { width:100%; height:100%; object-fit:cover; }
#intro .d { position:absolute; left:0; right:0; top:1480px; text-align:center; }
#intro .d span { display:inline-block; background:#650C75; color:#fff; font-weight:800; font-size:46px; letter-spacing:3px; padding:16px 32px; border-left:12px solid #EFC618; }
#bug { left:60px; top:120px; background:#650C75; color:#fff; font-weight:800; font-size:32px; letter-spacing:3px; padding:12px 22px; border-left:10px solid #EFC618; visibility:hidden; }
#bug b { color:#EFC618; }
/* place card, like the name card at a dinner table */
.card { left:56px; right:56px; top:1230px; height:470px; visibility:hidden; }
.card .paper { position:absolute; inset:0; border-radius:30px; background:#FFF7EA; padding:44px 48px 0 48px;
  box-shadow:0 30px 90px rgba(0,0,0,0.6); border-top:14px solid #EFC618; }
.card .paper > span { display:block; }
.card .no { color:#650C75; font-weight:800; font-size:28px; letter-spacing:6px; }
.card .nm { margin-top:12px; color:#2A0631; font-weight:800; font-size:76px; line-height:0.98; letter-spacing:-3px; max-width:640px; }
.card .ad { margin-top:16px; color:#4a3a4e; font-weight:600; font-size:32px; }
.card .hrs { display:inline-block !important; margin-top:24px; background:#650C75; color:#fff; font-weight:800; font-size:38px; padding:12px 22px; border-radius:12px; }
.card .hrs b { color:#EFC618; }
.card .ig { position:absolute; left:48px; bottom:30px; color:#650C75; font-weight:700; font-size:28px; }
.card .lg { position:absolute; right:34px; top:40px; width:230px; height:170px; object-fit:contain; border-radius:18px; padding:14px; }
.card .mb { position:absolute; right:34px; top:-30px; background:#0B992F; color:#fff; font-weight:800; font-size:24px; letter-spacing:2px; padding:10px 18px; border-radius:10px; }
#ask { left:0; right:0; top:1300px; text-align:center; visibility:hidden; }
#ask span { display:inline-block; background:#650C75; color:#fff; font-weight:800; font-size:74px; letter-spacing:-2px; line-height:1.05; padding:26px 44px; border-radius:22px; border:5px solid #EFC618; }
#ask small { display:block; margin-top:26px; color:#fff; font-weight:700; font-size:38px; text-shadow:0 4px 16px rgba(0,0,0,0.9); }
#en { inset:0; background:radial-gradient(ellipse 100% 70% at 50% 35%, #7d1590 0%, #650C75 45%, #2a0631 100%); text-align:center; visibility:hidden; }
#en span, #en img { position:absolute; }
#en .ek { left:0; right:0; top:470px; color:#EFC618; font-weight:800; font-size:46px; letter-spacing:8px; }
#en .elogo { left:50%; top:580px; width:360px; height:360px; margin-left:-180px; object-fit:contain; }
#en .en { left:0; right:0; top:990px; color:#fff; font-weight:800; font-size:120px; letter-spacing:-4px; }
#en .eu { left:0; right:0; top:1150px; color:#fff; font-weight:700; font-size:46px; opacity:0.92; }
#en .cr { left:0; right:0; top:1700px; color:#fff; font-weight:600; font-size:22px; opacity:0.6; }
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{TOTAL}}" data-width="1080" data-height="1920">
  <div data-track-index="0">{{SHOTS}}</div>
  <div id="askbg"></div>
  <div class="warm"></div>
  <div class="ui" data-track-index="1">
    <div id="intro"><span class="k">{{KICKER}}</span><span class="tt">SUNDAY<br><b>DINNER</b></span>
      <div class="plates">{{PLATES}}</div><div class="d"><span>{{SUB}}</span></div></div>
    {{CARDS}}
    <div class="wipe">{{WIPES}}</div>
    <div id="ask"><span>Where are you<br>eating tonight?</span><small>Tell us in the comments</small></div>
    <div id="bug"><b>SUNDAY DINNER</b> · LOMPOC</div>
    <div id="en"><span class="ek">EVERY DINNER SPOT IS ON</span><img class="elogo" src="public/mark-white.png"/><span class="en">Lompoc Locals</span><span class="eu">lompoclocals.com/find/dinner</span><span class="cr">{{CREDIT}}</span></div>
  </div>
  {{AUDIO}}
</div>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused:true });
  {{JS}}
  window.__timelines["main"] = tl;
</script>
</body></html>
